name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from arcenciel_link.version import VERSION
          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != VERSION or tag != project:
              raise SystemExit(f"version mismatch: tag={tag}, runtime={VERSION}, project={project}")
          PY
      - name: Package extension
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: zip -r "arcenciel-link-forge-${RELEASE_TAG}.zip" arcenciel_link scripts install.py requirements.txt README.md LICENSE pyproject.toml -x "*/__pycache__/*" "*.pyc"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "arcenciel-link-forge-${RELEASE_TAG}.zip" --verify-tag --generate-notes --title "ArcEnCiel Link Forge ${RELEASE_TAG}"
