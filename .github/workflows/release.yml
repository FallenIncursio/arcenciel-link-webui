name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from arcenciel_link.version import VERSION
          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != VERSION or tag != project:
              raise SystemExit(f"version mismatch: tag={tag}, runtime={VERSION}, project={project}")
          PY
      - name: Package extension
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: zip -r "arcenciel-link-forge-${RELEASE_TAG}.zip" arcenciel_link javascript scripts notebooks install.py requirements.txt README.md LICENSE pyproject.toml -x "*/__pycache__/*" "*.pyc"
      - name: Verify native editor assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYCODE'
          import os, zipfile
          with zipfile.ZipFile(f"arcenciel-link-forge-{os.environ['RELEASE_TAG']}.zip") as package:
              required = {"javascript/0-aec-draft-inbox.js", "javascript/aec-draft-adapter.js", "arcenciel_link/drafts.py", "arcenciel_link/resources.py"}
              missing = required.difference(package.namelist())
              if missing:
                  raise SystemExit(f"Missing native editor files: {sorted(missing)}")
          PYCODE
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "arcenciel-link-forge-${RELEASE_TAG}.zip" --verify-tag --generate-notes --title "ArcEnCiel Link Forge ${RELEASE_TAG}"
