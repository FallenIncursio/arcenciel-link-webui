[project]
name = "arcenciel-link-forge"
description = "ArcEnCiel Link worker integration for Forge and compatible Stable Diffusion WebUIs."
version = "2.0.0"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "requests>=2.31",
  "tqdm>=4.66",
  "markdown-it-py>=3.0",
  "websocket-client>=1.6",
  "Pillow",
  "keyring>=24",
]

[project.urls]
Repository = "https://github.com/FallenIncursio/arcenciel-link-webui"
Documentation = "https://github.com/FallenIncursio/arcenciel-link-webui#readme"
"Bug Tracker" = "https://github.com/FallenIncursio/arcenciel-link-webui/issues"

[tool.setuptools.packages.find]
include = ["arcenciel_link*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
